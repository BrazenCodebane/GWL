workflows:
  android-aprs-sms-build:
    name: APRS-Lite App (Linux X2 Build)
    max_build_duration: 60
    instance_type: linux_x2
    
    environment:
      node: latest
      java: 17
      vars:
        PACKAGE_NAME: "com.gwl.aprs.sms"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Install dependencies & Capacitor CLI
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "APRS-Lite" "com.gwl.aprs.sms" --web-dir www

      - name: Prepare www assets & Capacitor Config
        script: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId": "com.gwl.aprs.sms", "appName": "APRS-Lite", "webDir": "www"}' > capacitor.config.json

      - name: Initialize Android Platform & Sync
        script: |
          npx cap add android
          npx cap sync android

      - name: Inject Bluetooth & Audio Permissions into AndroidManifest
        script: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          perm_name = "{http://schemas.android.com/apk/res/android}name"
          
          perms_to_add = [
              "android.permission.RECORD_AUDIO", 
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_ADMIN",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.ACCESS_FINE_LOCATION"
          ]
          for p in perms_to_add:
              if root.find(f"uses-permission[@{perm_name}=\"{p}\"]") is None:
                  perm = ET.Element("{http://schemas.android.com/apk/res/android}uses-permission", {perm_name: p})
                  root.insert(0, perm)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
          
      - name: Force Java 21 Toolchain & Compatibility
        script: |
          python3 -c '
          import glob
          
          # Force java target compatibility in all build.gradle files
          for path in glob.glob("android/**/build.gradle", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              
              # Replace or inject source/target compatibility
              if "sourceCompatibility" in content:
                  content = content.replace("JavaVersion.VERSION_1_17", "JavaVersion.VERSION_21")
                  content = content.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_21")
                  content = content.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_21")
              
              with open(path, "w") as f:
                  f.write(content)
          
          # Ensure project root gradle.properties uses Java 21 compatible settings if needed
          props_path = "android/gradle.properties"
          if os.path.exists(props_path):
              with open(props_path, "a") as f:
                  f.write("\norg.gradle.java.home=$JAVA_HOME\n")
          '
          
      - name: Force Unified Kotlin Version
        script: |
          python3 -c '
          build_gradle = "android/app/build.gradle"
          with open(build_gradle, "r") as f:
              content = f.read()
          
          resolution_block = """
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }
          """
          
          if "resolutionStrategy" not in content:
              content += resolution_block
              with open(build_gradle, "w") as f:
                  f.write(content)
          '

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Debug APK via Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - freakycdk@gmail.com
